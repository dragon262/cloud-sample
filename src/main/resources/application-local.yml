spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  #    properties:
  #      hibernate:
  #        format_sql: true
  sql:
    init:
      mode: always

server:
  port: 8080
  # forward-headers-strategy: native
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: "*"

pvc:
  path: /tmp
